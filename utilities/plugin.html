<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>商卡速改 CardSnap · 商卡设计系统</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="商卡速改 CardSnap：在 Figma 内快速 demo 商卡字段更新。读 PRD、校验字段与文案，一键生成多语言设计稿。">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  /* Figma Plugin 工具页 — 与选型指南同一套 Utilities 版式（dg-* 类名复用，

  .dg-crumb { font-size: 12px; color: var(--ink-5); margin-bottom: 16px; }
  .dg-crumb a { color: var(--ink-4); }
  .dg-crumb a:hover { color: var(--accent); }
  .dg-crumb .sep { margin: 0 6px; color: var(--ink-5); }
  .dg-head { padding: 8px 0 24px; border-bottom: 1px solid var(--outline); margin-bottom: 26px; }
  .dg-head__title { margin: 0 0 14px; font-size: 40px; font-weight: 700; letter-spacing: -.015em; color: var(--ink); line-height: 1.15; }
  .dg-head__subtitle { margin: 0; max-width: 780px; font-size: 14px; color: var(--ink-4); line-height: 1.75; }
  .dg-head__meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
  .dg-stat { display: inline-flex; align-items: baseline; gap: 7px; font-size: 12px; color: var(--ink-4); background: var(--surface-2); border: 1px solid var(--outline); padding: 5px 12px; border-radius: var(--r-pill); }
  .dg-stat b { font-size: 14px; font-weight: 800; color: var(--ink); font-family: var(--f-mono); }
  .dg-jump { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--outline); border-radius: var(--r-pill); margin-bottom: 34px; flex-wrap: wrap; }
  .dg-jump__link { display: inline-flex; align-items: center; gap: 7px; padding: 7px 15px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; color: var(--ink-3); text-decoration: none; transition: color .13s ease, background-color .13s ease; }
  .dg-jump__link:hover { color: var(--ink); background: var(--surface); }
  .dg-jump__num { font-family: var(--f-mono); font-size: 11px; opacity: .6; }
  .dg-sec { margin-bottom: 52px; scroll-margin-top: 96px; }
  .dg-sec__eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-family: var(--f-mono); margin-bottom: 8px; }
  .dg-sec__title { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .dg-sec__lede { margin: 0 0 22px; max-width: 720px; font-size: 13.5px; color: var(--ink-4); line-height: 1.7; }
  .dg-flow { border: 1px solid var(--outline); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow-1); }
  .dg-flow__body { padding: 26px 26px 28px; }
  .dg-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .dg-opt { display: flex; flex-direction: column; gap: 5px; padding: 16px 17px; border: 1px solid var(--outline); border-radius: var(--r-md); background: var(--surface); transition: border-color .13s ease, box-shadow .13s ease; }
  .dg-opt__label { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .dg-opt__tag { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--outline); display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 11px; font-weight: 700; color: var(--ink-4); }
  .dg-opt__desc { font-size: 12px; color: var(--ink-4); line-height: 1.55; padding-left: 31px; }
  .dg-rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .dg-rule { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border: 1px solid var(--outline); border-radius: var(--r-md); background: var(--surface); transition: border-color .13s ease, box-shadow .13s ease; }

  .dg-rule__if { flex: 1 1 auto; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .dg-rule__then { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .dg-setup { border: 1px solid var(--outline); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow-1); }
  .dg-setup__row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--outline); align-items: start; }
  .dg-setup__row:last-child { border-bottom: 0; }
  .dg-setup__num { font-family: var(--f-mono); font-size: 13px; font-weight: 800; color: var(--accent); padding-top: 1px; }
  .dg-setup__title { font-size: 14px; font-weight: 700; color: var(--ink); }
  .dg-setup__desc { margin-top: 4px; font-size: 12.5px; color: var(--ink-4); line-height: 1.6; }
  .dg-setup__desc code { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--outline); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .dg-setup__desc a { color: var(--accent); }
  .dg-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; text-decoration: none; transition: background-color .13s ease, border-color .13s ease, color .13s ease; }
  .dg-btn--primary { background: var(--accent); color: var(--bg); }
  .dg-btn--primary:hover { background: var(--accent-600); }
  .dg-btn--ghost { background: var(--surface); color: var(--ink-2); border-color: var(--outline-strong); }
  .dg-btn--ghost:hover { border-color: var(--accent); color: var(--accent); }
  .dg-btn svg { width: 15px; height: 15px; }
  .dg-setup__dl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--outline); background: var(--accent-50); }
  .dg-setup__dlhint { flex: 1 1 260px; font-size: 12px; color: var(--ink-4); line-height: 1.55; }
  .cap-grid { display: grid; gap: 26px; }
  .cap-step { margin: 0; }
  .cap-shot { display: flex; justify-content: center; background: var(--surface-2); border: 1px solid var(--outline); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow-1); }
  .cap-frame { position: relative; display: block; font-size: 0; line-height: 0; }
  .cap-frame img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--outline); }
  .cap-shot--fit .cap-frame img { width: auto; max-height: 520px; max-width: 100%; }
  .cap-step figcaption { display: flex; gap: 10px; align-items: baseline; margin-top: 12px; }
  .cap-step__head { margin: 0 0 10px; font-size: 14.5px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; }
  .cap-step__head .num { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
  .cap-step__desc { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-4); line-height: 1.65; }
  .dg-foot { margin-top: 8px; padding: 22px 0; border-top: 1px solid var(--outline); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-5); }
  @media (max-width: 900px) { .dg-head__title { font-size: 30px; } }
</style>
</head>

          '<div class="dg-opt"><span class="dg-opt__label"><span class="dg-opt__tag">…</span>' + esc(t('mvpNextTitle')) + '</span><span class="dg-opt__desc">' + esc(t('mvpNextDesc')) + '</span></div>' +
        '</div>' +
      '</section>' +
      '<div class="dg-foot"><span>' + esc(t('footNote')) + '</span><span>Last updated 2026-11-25</span></div>';
  }

  document.addEventListener('click', function (e) {
    var jump = e.target.closest('[href^="#plugin-"]');
    if (jump && root.contains(jump)) {
      var target = document.querySelector(jump.getAttribute('href'));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  window.addEventListener('joybuy:languagechange', render);
  render();
})();
</script>
